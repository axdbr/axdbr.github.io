<style>
/* Layout: one left-aligned reading column (max 1120px); hero = name + photo, then the revenue chain as the page's signature band, then a dated timeline. */
:root{
  --paper:#F2F5F4; --surface:#FFFFFF; --ink:#132322; --muted:#566866; --line:#D3DDDB;
  --accent:#0C6A6D; --accent-ink:#FFFFFF; --signal:#B86E00; --chip:#E3ECEA;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s-1:.8125rem; --s0:1rem; --s1:1.1875rem; --s2:1.5rem; --s3:2.25rem; --s4:clamp(2.6rem,7.5vw,5.4rem);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1515; --surface:#132020; --ink:#E3ECEA; --muted:#91A5A2; --line:#263837;
  --accent:#4CC2BA; --accent-ink:#06201F; --signal:#E8AC45; --chip:#1A2B2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1515; --surface:#132020; --ink:#E3ECEA; --muted:#91A5A2; --line:#263837;
  --accent:#4CC2BA; --accent-ink:#06201F; --signal:#E8AC45; --chip:#1A2B2A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--s0);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:var(--s-1);letter-spacing:.04em}
.label{font-family:var(--f-mono);font-size:var(--s-1);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:20px;gap:12px}
.top .mark{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 125;letter-spacing:.02em;font-size:var(--s-1);text-transform:uppercase}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:var(--s-1);padding:4px 12px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible,.btn:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top-right actions */
.topr{display:flex;align-items:center;gap:10px}
.toplink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.875rem;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.toplink svg{width:14px;height:14px}
.toplink:hover{border-color:var(--accent);color:var(--accent)}
.toplink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:48px;align-items:end;padding-block:32px 40px}
.hero h1{font-size:var(--s4);font-weight:850;font-variation-settings:"wdth" 118;line-height:.92;letter-spacing:-.02em}
.role{font-family:var(--f-display);font-variation-settings:"wdth" 100;font-weight:600;font-size:var(--s2);color:var(--accent);margin-top:14px}
.pitch{font-size:var(--s1);max-width:40em;margin-top:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:18px;color:var(--muted)}
.meta .sel{color:var(--ink);user-select:all}
.status{color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#2E9E5B;box-shadow:0 0 0 3px color-mix(in srgb,#2E9E5B 25%,transparent)}
.photo{width:100%;max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;filter:saturate(.92)}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;align-items:center}
.chip{background:var(--chip);border-radius:4px;padding:4px 10px;font-size:var(--s-1);font-weight:500}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:.9375rem;padding:11px 18px;border-radius:6px;border:1px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink);font-family:var(--f-body)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:16px;height:16px;flex:none}
.ctas2{margin-top:10px}
.btn.ghost{border-color:transparent;padding-inline:4px;text-decoration:underline;text-underline-offset:3px}
.btn.tel.shown span{font-family:var(--f-mono);user-select:all}
.note{min-height:1.4em;margin-top:8px;color:var(--muted);font-size:var(--s-1)}

/* revenue chain: one column per gate, items stacked under each gate */
.chain{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:28px 32px}
.gates{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.gates::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.gates::after{content:"";position:absolute;top:5px;left:0;width:48px;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--signal));animation:flow 6s linear infinite}
@keyframes flow{from{left:0}to{left:calc(100% - 48px)}}
@media (prefers-reduced-motion:reduce){.gates::after{display:none}}
.gate{position:relative;z-index:1;min-width:0;padding-right:16px}
.gate::before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.gate h3{font-family:var(--f-display);font-variation-settings:"wdth" 92;font-weight:750;font-size:1rem;margin:12px 0 10px}
.gate ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.gate li{font-size:.875rem;line-height:1.35;color:var(--muted);padding-left:10px;border-left:2px solid var(--line)}
.gate li:hover{color:var(--ink);border-left-color:var(--accent)}

/* AI */
.ai-intro{max-width:62ch;font-size:var(--s1)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:28px}
.steps h3{font-size:var(--s1);font-weight:700;margin-bottom:6px}
.steps h3 span{font-family:var(--f-mono);font-size:var(--s-1);color:var(--signal);font-weight:500;margin-right:8px}
.steps p{color:var(--muted)}
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:8px}
.agent .gt{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.agent h4{margin:0;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 108;font-size:var(--s1);line-height:1.15}
.agent p{color:var(--muted);font-size:.9375rem}


/* school credential under the portrait */
.portrait{display:grid;gap:10px}
.cred{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.cred b{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 115;letter-spacing:.06em;font-size:.875rem}
.cred span{color:var(--muted);font-size:.8125rem}

/* table of contents */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);box-shadow:0 0 0 100vmax var(--paper);clip-path:inset(0 -100vmax);border-bottom:1px solid var(--line)}
.toc ul{list-style:none;margin:0;padding:10px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.toc ul::-webkit-scrollbar{display:none}
.toc button{all:unset;cursor:pointer;white-space:nowrap;font-size:.875rem;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--muted)}
.toc button:hover{color:var(--ink);background:var(--chip)}
.toc button[aria-current="true"]{color:var(--accent-ink);background:var(--accent)}
.toc button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main section{scroll-margin-top:72px}

/* tech stack: one compact table, a row per layer */
.stack-intro{color:var(--muted);max-width:62ch;margin:-14px 0 20px}
.stack{margin:0;display:grid;border-top:1px solid var(--line)}
.stack div{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;padding-block:10px;border-bottom:1px solid var(--line);align-items:baseline}
.stack dt{font-family:var(--f-mono);font-size:var(--s-1);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack dd{margin:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600}
@media (max-width:640px){.stack div{grid-template-columns:minmax(0,1fr);gap:4px}}

/* figures */
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding-block:32px 36px}
.fig b{display:block;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 112;font-size:var(--s3);line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.fig span{display:block;margin-top:10px;color:var(--muted);font-size:.9375rem}

section.block{padding-block:48px;border-top:1px solid var(--line)}
section.block>h2{font-size:var(--s3);font-weight:800;font-variation-settings:"wdth" 110;margin-bottom:28px}

.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.pillars h3{font-size:var(--s1);font-weight:700;font-variation-settings:"wdth" 100;margin-bottom:8px}
.pillars p{color:var(--muted)}

/* timeline */
.job{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;padding-block:28px;border-bottom:1px solid var(--line)}
.job:first-of-type{padding-top:0}
.job:last-child{border-bottom:0}
.when{color:var(--muted)}
.when b{display:block;color:var(--ink);font-weight:500}
.job h3{font-size:var(--s2);font-weight:800;font-variation-settings:"wdth" 108;line-height:1.1}
.job .title{font-weight:600;color:var(--accent);margin-top:4px}
.job .ctx{color:var(--muted);margin-top:8px;max-width:62ch}
.job ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;max-width:68ch}
.job ul li{padding-left:18px;position:relative}
.job ul li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:2px;background:var(--signal)}
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.mission.featured{grid-column:1/-1;border-color:var(--accent)}
.mission.featured ul{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;max-width:none}
.mission{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.mission h4{margin:0;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 110;font-size:var(--s1)}
.mission .sector{margin-top:4px;color:var(--muted)}
.mission ul{margin-top:12px}
.others{margin-top:18px;color:var(--muted);max-width:70ch;font-size:.9375rem}

/* facts */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;max-width:820px}
.facts h3{font-size:var(--s-1);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500;margin-bottom:14px}
.tools{display:grid;gap:14px}
.tools div b{display:block;font-weight:600;font-size:.9375rem;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.edu{display:grid;gap:12px}
.edu div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px}
.edu b{font-weight:600}
.edu small{display:block;color:var(--muted);font-size:.875rem}
.plain{margin:0;padding:0;list-style:none;display:grid;gap:8px}

.beyond{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.beyond h3{font-size:var(--s1);font-weight:700;margin-bottom:6px}
.beyond p{color:var(--muted)}

/* contact */
.contact{background:var(--ink);color:var(--paper);border-radius:8px;padding:40px;margin-block:8px 48px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center}
.contact h2{font-size:var(--s3);font-weight:850;font-variation-settings:"wdth" 118}
.contact p{margin-top:10px;opacity:.85;max-width:44ch}
.contact .btn{border-color:var(--paper);color:var(--paper)}
.contact .btn.ghost{border-color:transparent}
.contact .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lines{display:grid;gap:10px;margin-top:20px}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.line span{font-family:var(--f-mono);font-size:.9375rem;user-select:all;overflow-wrap:anywhere}
.copy{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.75rem;padding:3px 8px;border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);border-radius:4px}
footer{padding-block:0 32px;color:var(--muted)}

@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr);gap:28px}
  .hero .portrait{width:132px;order:-1}
  .hero .portrait{width:auto;max-width:280px}
  .hero .photo{width:132px}
  .figures{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pillars,.facts,.steps{grid-template-columns:minmax(0,1fr)}
  .agents{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gates{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:28px}
  .gates::before,.gates::after{display:none}
  .contact{grid-template-columns:minmax(0,1fr);padding:28px}
}
@media (max-width:640px){
  .gates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .agents,.mission.featured ul{grid-template-columns:minmax(0,1fr)}
  .job{grid-template-columns:minmax(0,1fr);gap:8px}
  .missions,.beyond{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
</style>

</head>

const C = DATA.contact;
const ICON = {
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  li:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5.1c0-1.22-.02-2.78-1.7-2.78-1.7 0-1.96 1.33-1.96 2.7V21h-4z"/></svg>',

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let downloads = null;
const IN_CLAUDE = !!(window.claude && window.claude.use);
let lang = 'en';

function ctas(t, idp){
  return `<div class="ctas">
    <a class="btn primary" href="${esc(C.zcal)}" target="_blank" rel="noopener">${ICON.cal}${esc(t.cta_call)}</a>
    ${C.linkedin ? `<a class="btn" href="${esc(C.linkedin)}" target="_blank" rel="noopener">${ICON.li}${esc(t.cta_linkedin)}</a>` : ''}
    <button type="button" class="btn mail" data-note="${idp}-note">${ICON.mail}${esc(t.cta_email)}</button>
    <button type="button" class="btn tel" aria-live="polite">${ICON.tel}<span>${esc(t.cta_phone)}</span></button>
  </div>
  <div class="ctas2">${IN_CLAUDE
    ? `<button type="button" class="btn ghost pdf" id="${idp}-pdf" ${downloads ? '' : 'hidden'}>${ICON.dl}${esc(t.cta_pdf)}</button>`
    : `<a class="btn ghost" href="cv-${lang}.pdf" download="CV_Axel_Debreilly_${lang.toUpperCase()}.pdf">${ICON.dl}${esc(t.cta_pdf)}</a>`}</div>
  <p class="note" id="${idp}-note" role="status"></p>`;
}

function render(){
  const t = DATA[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const ul = arr => `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const jobs = t.experience.map(j => `
    <article class="job">
      <div class="when mono"><b>${esc(j.dates)}</b>${j.duration ? esc(j.duration) : ''}</div>
      <div>
        <h3>${esc(j.company)}</h3>
        <p class="title">${esc(j.title)}</p>
        ${j.context ? `<p class="ctx">${esc(j.context)}</p>` : ''}
        ${j.bullets.length ? ul(j.bullets) : ''}
        ${j.missions ? `<p class="label" style="margin-top:22px">${esc(t.missions_label)}</p>
          <div class="missions">${j.missions.map(m => `
            <div class="mission${m.featured ? ' featured' : ''}"><h4>${esc(m.client)}</h4><p class="sector mono">${esc(m.sector)}</p>${ul(m.work)}</div>`).join('')}
          </div><p class="others">${esc(t.other_clients)}</p>` : ''}
      </div>
    </article>`).join('');

  document.getElementById('app').innerHTML = `
    <section class="hero">
      <div>
        <h1>Axel<br>Debreilly</h1>
        <p class="role">${esc(t.role)}</p>
        <p class="pitch">${esc(t.pitch)}</p>
        <div class="meta mono"><span class="status">${esc(t.status)}</span><span>${esc(t.location)}</span></div>
        <div class="targets"><span class="label">${esc(t.targets_label)}</span>${t.targets.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>
        ${ctas(t,'hero')}
      </div>
      <div class="portrait"><img class="photo" src="${PHOTO}" alt="Portrait of Axel Debreilly">
        <p class="cred"><b>EDHEC</b><span>Business School · ${esc(t.stamp[2])}</span></p></div>
    </section>

    <nav class="toc" aria-label="${esc(t.toc_label)}"><ul>${t.toc.map(([id,l]) => `<li><button type="button" data-go="${id}">${esc(l)}</button></li>`).join('')}</ul></nav>

    <section class="figures">${t.figures.map(f => `<div class="fig"><b>${esc(f.n)}</b><span>${esc(f.l)}</span></div>`).join('')}</section>

    <section class="chain" id="chain" aria-label="${esc(t.chain_label)}">
      <p class="label">${esc(t.chain_label)}</p>
      <ol class="gates">${t.chain.map(g => `<li class="gate"><h3>${esc(g.h)}</h3><ul>${g.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></li>`).join('')}</ol>
    </section>

    <section class="block" id="stack"><h2>${esc(t.tools_title)}</h2>
      <p class="stack-intro">${esc(t.stack_intro)}</p>
      <dl class="stack">${t.tools.map(g => `<div><dt>${esc(g.h)}</dt><dd>${g.items.map(i => `<span>${esc(i)}</span>`).join('')}</dd></div>`).join('')}</dl>
    </section>



    <section class="block" id="pillars"><h2>${esc(t.pillars_title)}</h2>
      <div class="pillars">${t.pillars.map(p => `<div><h3>${esc(p.h)}</h3><p>${esc(p.p)}</p></div>`).join('')}</div>
    </section>

    <section class="block" id="ai"><h2>${esc(t.ai_title)}</h2>
      <p class="ai-intro">${esc(t.ai_intro)}</p>
      <div class="steps">${t.ai_steps.map((x,i) => `<div><h3><span>0${i+1}</span>${esc(x.h)}</h3><p>${esc(x.p)}</p></div>`).join('')}</div>
      <p class="label" style="margin-top:36px">${esc(t.ai_examples_label)}</p>
      <div class="agents">${t.agents.map(a => `<div class="agent"><span class="gt">${esc(a.gate)}</span><h4>${esc(a.h)}</h4><p>${esc(a.p)}</p></div>`).join('')}</div>
    </section>

    <section class="block" id="experience"><h2>${esc(t.exp_title)}</h2>${jobs}</section>

    <section class="block" id="background">
      <div class="facts">
        <div><h3>${esc(t.edu_title)}</h3><div class="edu">${t.education.map(e => `<div><span class="mono">${esc(e.y)}</span><span><b>${esc(e.h)}</b><small>${esc(e.s)}</small></span></div>`).join('')}</div></div>
        <div><h3>${esc(t.lang_title)}</h3><ul class="plain">${t.languages.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>
      </div>
    </section>

    <section class="block" id="beyond"><h2>${esc(t.beyond_title)}</h2>
      <div class="beyond">${t.beyond.map(b => `<div><h3>${esc(b.h)}</h3><p>${esc(b.p)}</p></div>`).join('')}</div>
    </section>

    <section class="contact" id="contact">
      <div>
        <h2>${esc(t.contact_title)}</h2>
        <p>${esc(t.contact_text)}</p>
      </div>
      <div>${ctas(t,'foot')}</div>
    </section>
    <footer class="mono">© 2026 Axel Debreilly · Marseille</footer>`;
}

function setLang(l, push){
  lang = (l === 'fr') ? 'fr' : 'en';
  try { localStorage.setItem('cv-lang', lang); } catch(e) {}
  if (push) history.replaceState(null, '', lang === 'fr' ? '#fr' : '#en');
  render();
  watchSections();
}
let io = null;
function watchSections(){
  if (!('IntersectionObserver' in window)) return;
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) document.querySelectorAll('.toc button').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === en.target.id))); });
  }, {rootMargin:'-30% 0px -60% 0px'});
  DATA[lang].toc.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
}

document.addEventListener('click', async ev => {
  const go = ev.target.closest('[data-go]');
  if (go) { const el = document.getElementById(go.dataset.go); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); return; }
  const lb = ev.target.closest('.lang button');
  if (lb) return setLang(lb.dataset.lang, true);
  const cp = ev.target.closest('.copy');
  if (cp) {
    const el = document.getElementById(cp.dataset.copy);
    try { await navigator.clipboard.writeText(el.textContent); cp.textContent = DATA[lang].cta_copied; }
    catch(e) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    return;
  }
  const mail = ev.target.closest('.mail');
  if (mail) {
    const note = document.getElementById(mail.dataset.note);
    try { await navigator.clipboard.writeText(C.email); note.textContent = DATA[lang].email_copied + ' : ' + C.email; }
    catch(e) { note.textContent = C.email; const r = document.createRange(); r.selectNodeContents(note); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    return;
  }
  const tel = ev.target.closest('.tel');
  if (tel) { tel.querySelector('span').textContent = C.phone; tel.classList.add('shown'); return; }
  const pdf = ev.target.closest('.pdf');
  if (pdf) {
    const note = document.getElementById(pdf.id.replace('-pdf','-note'));
    const t = DATA[lang];
    try {
      const res = await fetch(`cv-${lang}.pdf`);
      if (!res.ok) throw {code:'unavailable'};
      const blob = await res.blob();
      await downloads.save({filename:`CV_Axel_Debreilly_${lang.toUpperCase()}.pdf`, data:blob});
      note.textContent = t.pdf_saved;
    } catch(e) {
      note.textContent = (e && e.code === 'declined') ? t.pdf_declined : (e && e.code === 'rate_limited') ? '' : t.pdf_unavailable;
    }
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'fr' || h === 'en') setLang(h, false); });

(function init(){
  const h = location.hash.slice(1);
  let saved = null; try { saved = localStorage.getItem('cv-lang'); } catch(e) {}
  setLang(h === 'fr' || h === 'en' ? h : (saved || 'en'), false);
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(d => { if (d) { downloads = d; document.querySelectorAll('.pdf').forEach(b => b.hidden = false); } }).catch(() => {});
  }
})();
</script>
